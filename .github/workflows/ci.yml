name: ci
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save eslint@9 @eslint/js@9 globals@16 prettier@3
      - run: npx eslint src bin test && npx prettier --check src bin test
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: npm test
      - name: smoke test the packed tarball
        shell: bash
        run: |
          npm pack --silent
          mkdir -p /tmp/smoke && cd /tmp/smoke && npm init -y >/dev/null && npm i "$GITHUB_WORKSPACE"/argue-ai-*.tgz >/dev/null
          npx argue --version && npx argue doctor && npx argue --help >/dev/null
