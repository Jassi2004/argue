name: verify-release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact published npm version (for example 0.3.1)
        required: true
        type: string
      source_sha:
        description: Full source commit recorded in the npm package gitHead
        required: true
        type: string
permissions:
  contents: read
  statuses: write
jobs:
  verify:
    name: GitLab release verification
    timeout-minutes: 30
    concurrency:
      group: gitlab-release-verification-${{ inputs.source_sha }}
      cancel-in-progress: false
    env:
      ARGUE_SOURCE_SHA: ${{ inputs.source_sha }}
      GITLAB_VERIFICATION_PROJECT_ID: ${{ vars.GITLAB_VERIFICATION_PROJECT_ID }}
      GITHUB_TOKEN: ${{ github.token }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Schedule independent GitLab verification
        id: gitlab
        env:
          ARGUE_VERSION: ${{ inputs.version }}
          ARGUE_SOURCE_SHA: ${{ inputs.source_sha }}
          GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
          GITLAB_VERIFICATION_PROJECT_ID: ${{ vars.GITLAB_VERIFICATION_PROJECT_ID }}
        run: node scripts/trigger-release-verification.mjs
      - name: Report the actual GitLab result on the source commit
        env:
          GITLAB_PIPELINE_ID: ${{ steps.gitlab.outputs.pipeline_id }}
        run: node scripts/watch-release-verification.mjs
      - name: Mark interrupted verification
        if: ${{ cancelled() && steps.gitlab.outputs.pipeline_id != '' }}
        env:
          GITLAB_PIPELINE_ID: ${{ steps.gitlab.outputs.pipeline_id }}
        run: node scripts/watch-release-verification.mjs --cancel
