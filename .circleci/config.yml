version: 2.1

jobs:
  audit-npm-package-content:
    docker:
      - image: cimg/node:24
    steps:
      - checkout
      - run:
          name: Audit npm package contents and manifest
          command: node scripts/audit-npm-package.mjs

workflows:
  npm-package-content-audit:
    jobs:
      - audit-npm-package-content:
          filters:
            branches:
              only: main
            tags:
              ignore: /.*/
